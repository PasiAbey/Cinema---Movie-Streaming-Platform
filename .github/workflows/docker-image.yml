name: Cinema CI/CD pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - README.md
      - infrastructure/**

jobs:

  build-the-docker-image:

    runs-on: ubuntu-latest

    steps:
      - name: Check the Repository
        uses: actions/checkout@v4

      - name: Log in to the aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to the AWS ECR registry
        uses: aws-actions/amazon-ecr-login@v2

      - name: Add Version Tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build the Frontend Docker Image and Push it into ECR
        run: |
          docker build -t ${{ secrets.FRONT_END_REPO}}:$IMAGE_TAG ./frontend
          docker push ${{ secrets.FRONT_END_REPO}}:$IMAGE_TAG

      - name: Build the catalog Docker Image and push it into ECR
        run: |
          docker build -t ${{ secrets.CATALOG_SERVICE_REPO }}:$IMAGE_TAG ./services/catalog-service
          docker push ${{ secrets.CATALOG_SERVICE_REPO }}:$IMAGE_TAG

      - name: Build the gateway Docker Image and push it into ECR
        run: |
          docker build -t ${{ secrets.GATEWAY_REPO }}:$IMAGE_TAG ./services/gateway
          docker push ${{ secrets.GATEWAY_REPO }}:$IMAGE_TAG

      - name: Build the user service Docker Image and push it into ECR
        run: |
          docker build -t ${{ secrets.USER_SERVICE_REPO }}:$IMAGE_TAG ./services/user-service
          docker push ${{ secrets.USER_SERVICE_REPO }}:$IMAGE_TAG
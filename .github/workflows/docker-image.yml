name: Cinema CI/CD pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - README.md
      - infrastructure/**

jobs:

  build-the-docker-image:

    runs-on: ubuntu-latest

    steps:
      - name: Check the Repository
        uses: actions/checkout@v4

      - name: Log in to the aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to the AWS ECR registry
        uses: aws-actions/amazon-ecr-login@v2

      - name: Add Version Tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build the Frontend Docker Image
        run: |
          docker build -t ${{ secrets.FRONT_END_REPO}}:$IMAGE_TAG ./frontend
          docker push ${{ secrets.FRONT_END_REPO}}:$IMAGE_TAG
















      - name: Log in to the DockerHub registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
      - name: Build the catalog-service image
        run: docker build -f ./services/catalog-service/Dockerfile ./services/catalog-service --tag ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-catalog-services:latest

      - name: Build the gateway image
        run: docker build -f ./services/gateway/Dockerfile ./services/gateway --tag ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-gateway:latest

      - name: Build the user-service image
        run: docker build -f ./services/user-service/Dockerfile ./services/user-service --tag ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-user-service:latest

      - name: Build the frontend image
        run: docker build -f ./frontend/Dockerfile ./frontend --tag ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-frontend:latest

      - name: Push the catalog-service image into Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-catalog-services:latest

      - name: Push the gateway image into Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-gateway:latest

      - name: Push the user-service image into Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-user-service:latest

      - name: Push the frontend image into Registry
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/movie-streamer-frontend:latest
